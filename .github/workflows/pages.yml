name: Deploy HydroRadar to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check JavaScript syntax
        run: |
          for file in app.js geometry.js placement.js report.js; do
            node --check "$file"
          done

      - name: Validate and prepare static site
        run: python3 scripts/prepare_pages.py "${{ runner.temp }}/hydroradar-site"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/hydroradar-site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
